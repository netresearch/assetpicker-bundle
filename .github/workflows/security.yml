name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  betterleaks:
    uses: netresearch/.github/.github/workflows/betterleaks.yml@main
    permissions:
      contents: read
      security-events: write

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: netresearch/.github/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write

  composer-audit:
    uses: netresearch/typo3-ci-workflows/.github/workflows/security.yml@main
    # The scopes the reusable's jobs declare (see its CALLER REQUIREMENTS);
    # without them the run depends on the repository's default token scope.
    permissions:
      contents: read
      security-events: write
